; Workshop config for Connaught Creek (13 km2), ALOS ~30 m.
; Paths are relative to the repository root once the data zip is unpacked.
; Pins and filenames will be filled when the bundle is cut.
;
; Do not point this file at the 5 m lidar comparison stack or at the
; South Coast benchmark during the live session.

[General]
project_name = autoATES_v3_workshop_connaught
working_dir = ./outputs/connaught
output_basename = autoATES_v3
target_resolution_x = 0
target_resolution_y = 0
aoi_path = ./data/aoi/connaught_creek.shp

[Input]
dem_path = ./data/01_elevation/inputs/alos_aw3d30_connaught.tif
forest_canopy_path = ./data/02_forest/outputs_reference/sen2_canopy_cover.tif

[Processing]
run_pra = True
run_runout = True
run_ates = True
run_colorize = True

[PRA]
run_frequent = True
run_extreme = True
sieve_filter_m2 = 1000
forest_type = sen2cc
enable_ruggedness = False

; Typical (frequent) scenario
frequent_pra_threshold = 0.25
frequent_slope_a = 12
frequent_slope_b = 4
frequent_slope_c = 42.5
frequent_forest_a = 50
frequent_forest_b = 3.0
frequent_forest_c = 0

; Infrequent (extreme) scenario
extreme_pra_threshold = 0.05
extreme_slope_a = 14
extreme_slope_b = 4
extreme_slope_c = 40
extreme_forest_a = 50
extreme_forest_b = 3.0
extreme_forest_c = 0

[Runout]
; Typical alpha 30 deg, infrequent 18 deg. Exact Flow-Py keys follow the
; pinned AvaFrame / autoATES tag.
frequent_alpha = 30
extreme_alpha = 18
