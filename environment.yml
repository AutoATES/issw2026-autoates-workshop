# ISSW 2026 autoATES v3.0 workshop environment.
# Install:  mamba env create -f environment.yml
#           conda env create -f environment.yml
#
# Geospatial stack from conda-forge. AutoATES and AvaFrame are cloned
# separately (see SETUP.md) so Windows does not have to compile AvaFrame.

name: autoates-workshop
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy
  - scipy
  - rasterio
  - geopandas
  - gdal
  - numba
  - matplotlib
  - pyyaml
  - tqdm
  - psutil
  - pandas
  - shapely
  - jupyterlab
  - ipywidgets
  - pip
  - pip:
    - ipykernel
