# ISSW 2026 autoATES v3.0 workshop environment.
# Install:  mamba env create -f environment.yml
#           conda env create -f environment.yml
#
# Geospatial stack from conda-forge. AutoATES and AvaFrame are cloned
# separately (see SETUP.md). After activating this env, compile AvaFrame's
# Cython extensions in place:
#   cd ../AvaFrame && python setup.py build_ext --inplace
# Do not pip install avaframe. That install pins numpy<2 and fights this env.

name: autoates-workshop
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy
  - scipy
  - rasterio
  - geopandas
  - gdal
  - numba
  - matplotlib
  - pyyaml
  - tqdm
  - psutil
  - pandas
  - shapely
  - scikit-image
  - jupyterlab
  - ipywidgets
  # Imported when com4FlowPy loads. cython builds DFAfunctionsCython.
  - cmcrameri
  - contextily
  - cython
  - deepdiff
  - deepmerge
  - pyshp
  - seaborn
  - tabulate
  - pip
  - pip:
    - ipykernel
